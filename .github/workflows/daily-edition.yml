name: Generar Edición Diaria 1717

on:
  schedule:
    - cron: '0 10 * * *' # 07:00 AM Argentina
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias y ejecutar script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm init -y
          npm install @google/generative-ai firebase
          node scripts/generateDailyEdition.js
